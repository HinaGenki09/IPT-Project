<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notifications</title>

    <link
        rel="stylesheet"
        href="/css/notifications.css"
    >

</head>

<body>

    <!-- ==========================
         LEFT SIDEBAR
    =========================== -->

    <aside class="notifications-sidebar">

        <div class="sidebar-menu-wrapper">

            <button
                class="sidebar-menu-button"
                id="sidebarMenuButton"
            >
                ☰
            </button>

            <div
                class="sidebar-account-menu"
                id="sidebarAccountMenu"
            >

                <button
                    class="account-menu-item"
                    id="profileMenuButton"
                >
                    👤
                    <span>Profile</span>
                </button>

                <button
                    class="account-menu-item"
                    id="logoutMenuButton"
                >
                    ↪
                    <span>Log Out</span>
                </button>

            </div>

        </div>


        <!-- NOTIFICATIONS -->

        <button
            class="notification-button active"
            id="notificationButton"
        >

            🔔

            <span
                class="notification-dot"
                id="notificationDot"
            ></span>

        </button>


        <!-- NAVIGATION -->

        <nav class="sidebar-navigation">

            <button
                class="sidebar-item"
                id="homeButton"
            >
                🏠
                <span>Dashboard</span>
            </button>

            <button
                class="sidebar-item"
                id="calendarSidebarButton"
            >
                🗓
                <span>Calendar</span>
            </button>

            <button
                class="sidebar-item"
                id="assetSidebarButton"
            >
                📁
                <span>Asset Library</span>
            </button>

            <button
                class="sidebar-item brief-sidebar-item"
                id="briefSidebarButton"
            >
                📝
                <span>Brief</span>
            </button>

            <button
                class="sidebar-item"
                id="referencesSidebarButton"
            >
                🔗
                <span>References</span>
            </button>

        </nav>

    </aside>


    <!-- ==========================
         NOTIFICATION PAGE
    =========================== -->

    <main class="notifications-page">

        <header class="notifications-header">

            <div>

                <h1>
                    🔔 Notifications
                </h1>

                <p>
                    Stay updated with activity in this campaign.
                </p>

            </div>

            <span
                class="unread-count"
                id="unreadCount"
            >
                0 unread
            </span>

        </header>


        <!-- FILTERS -->

        <div class="notification-filters">

            <button
                class="filter-button active"
                data-filter="All"
            >
                All
            </button>

            <button
                class="filter-button"
                data-filter="Audit Log"
            >
                Audit Log
            </button>

        </div>


        <!-- NOTIFICATIONS -->

        <section
            class="notification-list"
            id="notificationList"
        >

            <p class="loading-message">
                Loading notifications...
            </p>

        </section>

    </main>


    <script src="/js/notifications.js"></script>

</body>

</html>

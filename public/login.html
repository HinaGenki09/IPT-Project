<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In</title>

    <link
        rel="stylesheet"
        href="/css/login.css"
    >
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-left">

            <div class="company-name">
                <span class="logo-icon">■</span>
                <span>GC-KA SOHO</span>
            </div>

            <div class="login-content">

                <h1>Sign In</h1>

                <p class="subtitle">
                    Log in your account or
                    <a href="/signup.html">Sign Up</a>
                </p>

                <form id="loginForm">

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <button type="submit">
                        Sign In
                    </button>

                    <p id="loginMessage"></p>

                </form>

            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="login-right">

            <img
                src="/images/login-bg.jpg"
                alt="Purple flowers"
            >

        </div>

    </div>

    <script src="/js/login.js"></script>

</body>

</html>
